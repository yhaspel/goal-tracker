name: CI and test deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Check Markdown links
        run: npm run check:links
      - name: Check interface dictionaries
        run: npm run check:i18n
      - name: Build and test in Workers runtime
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Check production Worker bundle
        run: npx wrangler deploy --env production --dry-run --outdir /tmp/family-board-production-dry-run

  deploy-test:
    needs: checks
    if: ${{ vars.CLOUDFLARE_TEST_DEPLOY_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: family-board-test-deployment
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Install locked dependencies
        run: npm ci
      - name: Deploy isolated test Worker
        run: npm run deploy:test
      - name: Verify live routing and health
        run: python3 scripts/verify_stage_1.py https://family-board-test.yuval3000.workers.dev routing

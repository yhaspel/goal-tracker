name: CI and test deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Check Markdown links
        run: npm run check:links
      - name: Check interface dictionaries
        run: npm run check:i18n
      - name: Build and test in Workers runtime
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Check production Worker bundle
        run: npx wrangler deploy --env production --dry-run --outdir /tmp/family-board-production-dry-run

      # Stage 7 keeps the restore import out of production by build, not only by a runtime
      # check. If this step ever fails, a production deployment could be made to accept a
      # backup import, which is the one thing the restore environment exists to prevent.
      #
      # The check reads `index.js`, the script that is actually uploaded. The `index.js.map`
      # beside it embeds the original TypeScript sources, so it names every route in the
      # repository whatever the build stripped; it is not uploaded, and grepping it would
      # only ever report the source tree back.
      - name: Prove the restore import is absent from the production bundle
        run: |
          set -eu
          bundle=/tmp/family-board-production-dry-run/index.js
          test -f "$bundle"
          if grep -qF 'operator/import' "$bundle"; then
            echo '::error::The production bundle contains the restore import route.'
            exit 1
          fi
          if grep -qF 'restore_import_marker' "$bundle"; then
            echo '::error::The production bundle contains the restore import marker table.'
            exit 1
          fi
          # Stage 8's image phase is an import route too, and is gated the same way. The grep for
          # `operator/import` above already covers its path; this covers its staging table.
          if grep -qF 'restore_pending_images' "$bundle"; then
            echo '::error::The production bundle contains the restore image staging table.'
            exit 1
          fi
          grep -qF 'operator/export' "$bundle"

      - name: Check restore Worker bundle
        run: npx wrangler deploy --env restore --dry-run --outdir /tmp/family-board-restore-dry-run

      - name: Prove the restore bundle does carry the import route
        run: |
          set -eu
          bundle=/tmp/family-board-restore-dry-run/index.js
          test -f "$bundle"
          grep -qF 'operator/import' "$bundle"
          grep -qF 'restore_import_marker' "$bundle"
          grep -qF 'restore_pending_images' "$bundle"

  deploy-test:
    needs: checks
    if: ${{ vars.CLOUDFLARE_TEST_DEPLOY_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: family-board-test-deployment
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Install locked dependencies
        run: npm ci
      - name: Deploy isolated test Worker
        run: npm run deploy:test
      - name: Verify live routing and health
        run: python3 scripts/verify_stage_1.py https://family-board-test.yuval3000.workers.dev routing
